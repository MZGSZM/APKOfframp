name: Emulator tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Two versions of a tiny app, so the test can install, update, and detect.
      - name: Build the test app at version 1 and 2
        run: |
          ./gradlew :testapp:assembleDebug -PtestappVersion=1
          cp testapp/build/outputs/apk/debug/testapp-debug.apk "$RUNNER_TEMP/offramp-testapp-v1.apk"
          ./gradlew :testapp:assembleDebug -PtestappVersion=2
          cp testapp/build/outputs/apk/debug/testapp-debug.apk "$RUNNER_TEMP/offramp-testapp-v2.apk"
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb push "$RUNNER_TEMP/offramp-testapp-v1.apk" /data/local/tmp/offramp-testapp-v1.apk
            adb push "$RUNNER_TEMP/offramp-testapp-v2.apk" /data/local/tmp/offramp-testapp-v2.apk
            ./gradlew :app:connectedDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
